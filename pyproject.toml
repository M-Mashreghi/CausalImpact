[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "causalimpact"
version = "0.1.0"
description = "Estimand-first, assumption-aware causal inference and experimentation platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
# Core numerical stack only. Heavier libraries (statsmodels, scikit-learn, FastAPI,
# Streamlit, ...) are added by the task that first needs them, with justification.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/causalimpact"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: multi-component tests",
    "simulation: Monte Carlo / known-effect simulation tests",
    "e2e: end-to-end workflow tests",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["causalimpact"]
plugins = ["pydantic.mypy"]
