[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "causalimpact"
version = "0.1.0"
description = "Estimand-first, assumption-aware causal inference and experimentation platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
# Core numerical stack only. Heavier libraries (statsmodels, scikit-learn, FastAPI,
# Streamlit, ...) are added by the task that first needs them, with justification.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    # Task 6.2: typed HTTP API over the analysis service.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Task 6.3/6.4: Streamlit study designer and diagnostics dashboard (UI only, no causal math).
dashboard = ["streamlit>=1.38"]
dev = [
    "streamlit>=1.38",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",  # parallel runs; the simulation suite is CPU-bound
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "httpx2>=2.0",  # FastAPI/Starlette TestClient transport
]

[tool.hatch.build.targets.wheel]
packages = ["src/causalimpact"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: multi-component tests",
    "simulation: Monte Carlo / known-effect simulation tests",
    "e2e: end-to-end workflow tests",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["causalimpact"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scipy ships no inline type information; its call sites are covered by tests.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
